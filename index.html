<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pablo Bazán | Creative Technologist</title>
    
    <!-- Canonical URL (evita duplicados en Google) -->
    <link rel="canonical" href="https://pablobazan.com/">
    
    <!-- Meta SEO & Open Graph -->
    <meta name="description" content="Portfolio creativo de Pablo Bazán. Creative Technologist apasionado por el arte y la tecnología.">
    <meta name="keywords" content="Pablo Bazan, Creative Technologist, WebGL, Frontend Developer, UX/UI, Portfolio">
    <meta name="author" content="Pablo Bazán">
    <meta property="og:title" content="Pablo Bazán | Creative Technologist">
    <meta property="og:description" content="El portafolio interactivo de Pablo Bazán. Explorando la intersección del arte y la tecnología.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pablobazan.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="index, follow">

    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cursor-x: 50%;
            --cursor-y: 50%;
            --spotlight-size: 400px;
            --primary-glow: #00f3ff;
            --secondary-glow: #ff00c1;
            --bg-color: #030303;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            overflow: hidden; font-family: 'Space Grotesk', sans-serif;
            height: 100vh; width: 100vw; cursor: none; color: #fff;
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            z-index: 99; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #bgCanvas { position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.6; }

        .hud-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
            padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;
        }

        .hud-row {
            display: flex; justify-content: space-between; width: 100%; font-family: 'Space Mono', monospace; font-size: 0.75rem;
            color: rgba(255,255,255,0.2); letter-spacing: 2px; text-transform: uppercase;
        }

        .hud-line { position: absolute; background: rgba(255,255,255,0.05); }
        .hud-line.top { top: 30px; left: 30px; right: 30px; height: 1px; }
        .hud-line.bottom { bottom: 30px; left: 30px; right: 30px; height: 1px; }
        .hud-line.left { left: 30px; top: 30px; bottom: 30px; width: 1px; }
        .hud-line.right { right: 30px; top: 30px; bottom: 30px; width: 1px; }

        .content-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 1000px; text-align: center; z-index: 10; user-select: none; pointer-events: none;
            animation: float 6s ease-in-out infinite, fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes float { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -52%); } }
        @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, -40%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        h1 { font-size: 6vw; font-weight: 900; margin: 0 0 10px 0; line-height: 1; text-transform: uppercase; letter-spacing: -0.02em; }
        @media (min-width: 1200px) { h1 { font-size: 72px; } }
        p { font-family: 'Space Mono', monospace; font-size: 1.1rem; margin: 0 0 50px 0; letter-spacing: 0.1em; font-weight: 400; text-transform: uppercase; }
        
        .links-wrapper { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }

        a.magnetic { 
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-family: 'Space Mono', monospace; font-size: 0.85rem; text-decoration: none; 
            padding: 14px 28px; letter-spacing: 2px; text-transform: uppercase;
            border-radius: 100px; backdrop-filter: blur(5px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s;
        }

        .text-dimmed { position: relative; color: #1a1a1a; z-index: 11; }
        .text-dimmed p { color: #444; }
        .text-dimmed a.magnetic { pointer-events: auto; color: #333; border: 1px solid #222; background: rgba(0,0,0,0.5); }
        .text-dimmed a.magnetic:hover { 
            border-color: var(--primary-glow); color: var(--primary-glow); 
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1); 
            background: rgba(0, 243, 255, 0.05); 
        }

        .text-lit {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; color: #ffffff; z-index: 12; pointer-events: none;
            -webkit-mask-image: radial-gradient(circle var(--spotlight-size) at var(--cursor-x) var(--cursor-y), black 0%, rgba(0,0,0,0.95) 30%, transparent 60%);
            mask-image: radial-gradient(circle var(--spotlight-size) at var(--cursor-x) var(--cursor-y), black 0%, rgba(0,0,0,0.95) 30%, transparent 60%);
        }
        
        /* 4. Masked Video Reveal */
        .fluid-bg {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, rgba(0,243,255,0.2), rgba(255,0,193,0.1), rgba(0,17,255,0.1), rgba(0,243,255,0.2));
            background-size: 400% 400%; animation: gradientFlow 12s ease infinite; z-index: -2; opacity: 1; pointer-events: none;
            mix-blend-mode: screen;
        }
        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .text-lit p { color: #fff; text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow); }
        .text-lit a.magnetic { border: 1px solid rgba(255,255,255,0.4); color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }

        .glitch-title { position: relative; }
        .text-lit .glitch-title { animation: glitch-skew 3s infinite linear alternate-reverse; }
        .text-lit .glitch-title::before, .text-lit .glitch-title::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: -1; }
        .text-lit .glitch-title::before { color: var(--secondary-glow); clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-3px, 0); animation: glitch-anim-1 2.5s infinite linear alternate-reverse; opacity: 0.8; text-shadow: 0 0 15px var(--secondary-glow); }
        .text-lit .glitch-title::after { color: var(--primary-glow); clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); transform: translate(3px, 0); animation: glitch-anim-2 2s infinite linear alternate-reverse; opacity: 0.8; text-shadow: 0 0 15px var(--primary-glow); }

        @keyframes glitch-anim-1 { 0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); } 20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); } 40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); } 60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); } 80% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); } 100% { clip-path: inset(30% 0 50% 0); transform: translate(2px, -1px); } }
        @keyframes glitch-anim-2 { 0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); } 20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 2px); } 40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -1px); } 60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 2px); } 80% { clip-path: inset(50% 0 30% 0); transform: translate(2px, -2px); } 100% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, -1px); } }
        @keyframes glitch-skew { 0% { transform: skew(0deg); } 10% { transform: skew(-1deg); } 20% { transform: skew(0deg); } 90% { transform: skew(0deg); } 95% { transform: skew(1deg); } 100% { transform: skew(0deg); } }

        #custom-cursor { position: fixed; top: 0; left: 0; width: 12px; height: 12px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 100; transform: translate(-50%, -50%); transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s, border 0.3s; mix-blend-mode: difference; }
        #custom-cursor.hovered { width: 50px; height: 50px; background: transparent; border: 1px solid var(--primary-glow); mix-blend-mode: normal; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        #custom-cursor::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: var(--primary-glow); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s; }
        #custom-cursor.hovered::after { opacity: 1; }

        @media (max-width: 768px) { h1 { font-size: 3rem; } p { font-size: 0.8rem; margin-bottom: 30px; letter-spacing: 0.05em; line-height: 1.5; } a.magnetic { padding: 12px 20px; font-size: 0.8rem; width: 100%; box-sizing: border-box; } .links-wrapper { gap: 12px; flex-direction: column; width: 100%; max-width: 250px; margin: 0 auto; } :root { --spotlight-size: 380px; } .hud-container { padding: 20px; } .hud-line { display: none; } }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div id="custom-cursor"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="hud-container">
        <div class="hud-line top"></div><div class="hud-line bottom"></div><div class="hud-line left"></div><div class="hud-line right"></div>
        <div class="hud-row"><span>SYS.ON</span><span>INT.01</span></div>
        <div class="hud-row"><span>PB © 2026 // PORTFOLIO</span><span>CREATIVE_TECH</span></div>
    </div>

    <main class="content-container">
        <!-- CAPA OSCURA -->
        <div class="text-dimmed">
            <h1 class="glitch-title" data-text="Pablo Bazán">Pablo Bazán</h1>
            <p>Amante del arte y de la tecnología</p>
            <div class="links-wrapper">
                <a href="https://es.linkedin.com/in/pablobazan" target="_blank" class="magnetic">
                    LINKEDIN 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
                </a>
            </div>
        </div>

        <!-- CAPA ILUMINADA (Oculto a ScreenReaders y SEO para evitar texto duplicado) -->
        <div class="text-lit" aria-hidden="true">
            <div class="fluid-bg"></div>
            
            <h1 class="glitch-title" data-text="Pablo Bazán">Pablo Bazán</h1>
            <p>Amante del arte y de la tecnología</p>
            <div class="links-wrapper">
                <a href="https://es.linkedin.com/in/pablobazan" target="_blank" class="magnetic">
                    LINKEDIN 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
                </a>
            </div>
        </div>
    </main>

    <script>
        const cursorEl = document.getElementById('custom-cursor');
        const root = document.documentElement;
        
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, isMoving: false, timer: null };
        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;

        function updateCursor(x, y) {
            mouse.x = x; mouse.y = y; mouse.isMoving = true;
            clearTimeout(mouse.timer);
            mouse.timer = setTimeout(() => { mouse.isMoving = false; }, 100);
        }

        window.addEventListener('mousemove', (e) => updateCursor(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => updateCursor(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
        
        // 5. EFECTO GIROSCOPIO (Móvil)
        if (window.DeviceOrientationEvent && window.matchMedia("(max-width: 768px)").matches) {
            window.addEventListener('deviceorientation', function(e) {
                if (e.beta === null || e.gamma === null) return;
                let x = (e.gamma / 20) * window.innerWidth + window.innerWidth / 2;
                let y = ((e.beta - 50) / 20) * window.innerHeight + window.innerHeight / 2;
                x = Math.max(-100, Math.min(window.innerWidth+100, x));
                y = Math.max(-100, Math.min(window.innerHeight+100, y));
                updateCursor(x, y);
            }, false);
        }

        // 3. SECUENCIA DE ARRANQUE (Decodificador de Texto)
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        // Añadimos un pequeño delay inicial para mayor impacto cinemático
        setTimeout(() => {
            document.querySelectorAll('.glitch-title').forEach(el => {
                let interval = null;
                let originalText = el.getAttribute('data-text');
                let iteration = 0;
                interval = setInterval(() => {
                    el.innerText = originalText.split("").map((letter, index) => {
                        if(letter === " ") return " ";
                        if(index < iteration) return originalText[index];
                        return letters[Math.floor(Math.random() * letters.length)];
                    }).join("");
                    if(iteration >= originalText.length) clearInterval(interval);
                    iteration += 1 / 2.5; // Velocidad de decodificación
                }, 30);
            });
        }, 300);

        // 1. BOTÓN MAGNÉTICO
        const magneticElements = document.querySelectorAll('.magnetic');
        magneticElements.forEach(el => {
            el.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                this.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
                this.style.transition = 'none'; // Desactivamos transición durante drag
                cursorEl.classList.add('hovered');
            });
            el.addEventListener('mouseleave', function() {
                this.style.transform = `translate(0px, 0px)`;
                // Restaurar la transición CSS elástica
                this.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s';
                cursorEl.classList.remove('hovered');
            });
        });

        // 2. DISEÑO DE SONIDO (Web Audio API)
        let audioCtx;
        let ambientOsc;
        let ambientGain;
        let audioInitialized = false;

        function initAudio() {
            if(audioInitialized) return;
            audioInitialized = true;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            ambientOsc = audioCtx.createOscillator();
            ambientOsc.type = 'sine'; // Tono muy profundo
            ambientOsc.frequency.setValueAtTime(45, audioCtx.currentTime); 
            
            ambientGain = audioCtx.createGain();
            ambientGain.gain.setValueAtTime(0, audioCtx.currentTime);
            
            ambientOsc.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);
            
            ambientOsc.start();
            // Fade-in orgánico e inapreciable de fondo
            ambientGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 3);
            
            // Reacción sutil al ratón
            window.addEventListener('mousemove', (e) => {
                let normX = e.clientX / window.innerWidth;
                let normY = e.clientY / window.innerHeight;
                ambientOsc.frequency.setTargetAtTime(40 + (normX * 15) + (normY * 5), audioCtx.currentTime, 0.5);
                ambientGain.gain.setTargetAtTime(0.04 + (mouse.isMoving ? 0.02 : 0), audioCtx.currentTime, 0.5);
            });
        }

        function playHoverSound() {
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Interacción inicial para evitar bloqueo de autoplay en navegadores
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('mousemove', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });
        magneticElements.forEach(btn => btn.addEventListener('mouseenter', playHoverSound));

        // --- MOTOR DE FÍSICA Y PARTÍCULAS ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initParticles(); }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                this.size = (Math.random() * 2) + 0.5;
                this.type = Math.random() > 0.8 ? 2 : (Math.random() > 0.5 ? 1 : 0);
                this.angle = Math.random() * Math.PI * 2;
                const chars = "+-x/01"; this.char = chars.charAt(Math.floor(Math.random() * chars.length));
                this.baseColor = 'rgba(200, 200, 200, 0.7)'; this.color = this.baseColor; this.friction = 0.98;
            }

            draw() {
                if (!mouse.isMoving) {
                    let dist = Math.hypot(cursorX - this.x, cursorY - this.y);
                    if (dist < 200) this.color = 'rgba(0, 243, 255, 0.8)'; else this.color = this.baseColor;
                } else { this.color = this.baseColor; }

                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.fillStyle = this.color; ctx.strokeStyle = this.color; ctx.lineWidth = window.innerWidth < 768 ? 1.0 : 0.5;
                if (this.type === 0) { ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill(); } 
                else if (this.type === 1) { ctx.beginPath(); ctx.moveTo(0, -this.size*1.5); ctx.lineTo(this.size*1.5, this.size*1.5); ctx.lineTo(-this.size*1.5, this.size*1.5); ctx.closePath(); ctx.stroke(); } 
                else if (this.type === 2) { ctx.font = '10px "Space Mono"'; ctx.fillText(this.char, -4, 4); }
                ctx.restore();
            }

            update() {
                this.angle += 0.003; let dx = cursorX - this.x; let dy = cursorY - this.y;
                let dist = Math.hypot(dx, dy);

                if (mouse.isMoving) {
                    if (dist < 150) {
                        let force = (150 - dist) / 150;
                        this.vx -= (dx / dist) * force * 0.4; this.vy -= (dy / dist) * force * 0.4;
                    }
                } else {
                    let centerX = canvas.width / 2; let centerY = canvas.height / 2;
                    let distToCenter = Math.hypot(centerX - this.x, centerY - this.y);
                    if (distToCenter > 50) {
                        let force = distToCenter / canvas.width;
                        this.vx += ((centerX - this.x) / distToCenter) * force * 0.015;
                        this.vy += ((centerY - this.y) / distToCenter) * force * 0.015;
                    }
                }

                this.x += this.vx; this.y += this.vy; this.vx *= this.friction; this.vy *= this.friction;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
                this.draw();
            }
        }

        function initParticles() {
            particlesArray = []; let divisor = window.innerWidth < 768 ? 3500 : 3500;
            let nParticles = Math.floor((canvas.width * canvas.height) / divisor);
            for (let i = 0; i < nParticles; i++) particlesArray.push(new Particle());
        }

        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a + 1; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < 80 && dist > 0) {
                        let force = (80 - dist) / 80; let pushX = (dx / dist) * force * 0.05; let pushY = (dy / dist) * force * 0.05;
                        particlesArray[a].vx += pushX; particlesArray[a].vy += pushY; particlesArray[b].vx -= pushX; particlesArray[b].vy -= pushY;
                    }
                    if (dist < 90) {
                        let opacity = 1 - (dist / 90); ctx.strokeStyle = `rgba(200, 200, 200, ${opacity * 0.6})`; ctx.lineWidth = window.innerWidth < 768 ? 1.0 : 0.5;
                        ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }

                let mouseDist = Math.hypot(particlesArray[a].x - cursorX, particlesArray[a].y - cursorY);
                if (mouseDist < 180) {
                    let opacity = 1 - (mouseDist / 180); ctx.strokeStyle = `rgba(0, 243, 255, ${opacity * 0.3})`;
                    ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(cursorX, cursorY); ctx.stroke();
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate); ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            cursorX += (mouse.x - cursorX) * 0.12; cursorY += (mouse.y - cursorY) * 0.12;

            let container = document.querySelector('.content-container');
            let rect = container.getBoundingClientRect();
            let relativeX = mouse.x - rect.left; let relativeY = mouse.y - rect.top;

            root.style.setProperty('--cursor-x', relativeX + 'px'); root.style.setProperty('--cursor-y', relativeY + 'px');
            cursorEl.style.left = mouse.x + 'px'; cursorEl.style.top = mouse.y + 'px';

            for (let i = 0; i < particlesArray.length; i++) particlesArray[i].update();
            connect();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); animate();

    </script>
</body>
</html>
